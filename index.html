<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX RICH — Trading Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1a1e;
            --bg-elevated: #1b2429;
            --border: #1a2a30;
            --border-light: #2a3a40;
            --text: #f6fefd;
            --text-muted: #878c8f;
            --accent: #50d2c1;
            --accent-dim: rgba(80,210,193,0.15);
            --profit: #0ecb81;
            --loss: #f6465d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.3px; }
        .logo-icon { color: var(--accent); font-size: 1.2rem; }
        .mode-badge { background: var(--accent-dim); color: var(--accent); padding: 3px 10px; border-radius: 20px; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .conn { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--text-muted); }
        .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--loss); transition: background 0.3s; }
        .conn-dot.online { background: var(--profit); box-shadow: 0 0 6px var(--profit); }
        
        .portfolio { padding: 16px; border-bottom: 1px solid var(--border); }
        .port-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .port-title { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
        .port-time { font-size: 0.68rem; color: var(--text-muted); }
        .port-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 12px; }
        .metric { display: flex; flex-direction: column; gap: 4px; }
        .metric-label { font-size: 0.68rem; color: var(--text-muted); letter-spacing: 0.2px; }
        .metric-value { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; }
        .positive { color: var(--profit); }
        .negative { color: var(--loss); }
        
        .risk-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .risk-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.6s ease; }
        .risk-label { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.62rem; color: var(--text-muted); }
        
        .tabs { display: flex; padding: 0 16px; border-bottom: 1px solid var(--border); gap: 22px; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 12px 2px; font-size: 0.78rem; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; transition: all 0.2s; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .tab-content { display: none; padding: 14px 16px; min-height: 60vh; }
        .tab-content.active { display: block; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 0.82rem; font-weight: 600; }
        .badge { background: var(--bg-elevated); color: var(--text-muted); padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 500; }
        
        .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 13px; margin-bottom: 10px; transition: transform 0.15s, border-color 0.2s; }
        .card:active { transform: scale(0.98); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .symbol { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 0.88rem; }
        .symbol-emoji { font-size: 1.05rem; }
        .side-badge { padding: 3px 9px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; }
        .side-long { background: rgba(14,203,129,0.12); color: var(--profit); }
        .side-short { background: rgba(246,70,93,0.12); color: var(--loss); }
        
        .card-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .detail { display: flex; flex-direction: column; gap: 3px; }
        .detail-label { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
        .detail-value { font-size: 0.8rem; font-weight: 500; }
        
        .progress { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
        .progress-green { background: var(--profit); }
        .progress-red { background: var(--loss); }
        .progress-accent { background: var(--accent); }
        
        .card-footer { display: flex; justify-content: space-between; font-size: 0.62rem; color: var(--text-muted); margin-top: 4px; }
        
        .empty { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-icon { font-size: 2.8rem; margin-bottom: 14px; opacity: 0.4; }
        .empty-text { font-size: 0.92rem; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .empty-sub { font-size: 0.75rem; color: var(--text-muted); }
        
        .tv-container { width: 100%; height: 400px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-elevated); }
        .tv-container iframe { width: 100%; height: 100%; border: none; }
        
        .footer { padding: 14px 16px; border-top: 1px solid var(--border); margin-top: 10px; }
        .footer-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--loss); display: inline-block; margin-right: 6px; transition: background 0.3s; }
        .pulse.active { background: var(--profit); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .footer-text { font-size: 0.68rem; color: var(--text-muted); }
        
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: var(--bg); padding: 10px 20px; border-radius: 8px; font-weight: 700; z-index: 500; font-size: 0.82rem; opacity: 0; transition: all 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--loss); color: white; }
        
        .loading { display: flex; justify-content: center; align-items: center; padding: 40px; }
        .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .kill-banner { display: none; background: rgba(246,70,93,0.12); border: 1px solid rgba(246,70,93,0.25); border-radius: 8px; padding: 10px 14px; margin: 12px 16px; align-items: center; gap: 10px; }
        .kill-banner.active { display: flex; }
        .kill-text { color: var(--loss); font-weight: 700; font-size: 0.8rem; }
        
        .pair-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
        .pair-chip { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); text-align: center; cursor: pointer; transition: all 0.15s; }
        .pair-chip:hover { border-color: var(--border-light); color: var(--text); }
        .pair-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
        
        .refresh-btn { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 500; cursor: pointer; }
        .refresh-btn:active { background: var(--border-light); color: var(--text); }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex;align-items:center;gap:10px;">
            <div class="logo"><span class="logo-icon">◈</span><span>FX RICH</span></div>
            <span class="mode-badge" id="mode">PAPER</span>
        </div>
        <div class="conn"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">Offline</span></div>
    </div>
    
    <div class="kill-banner" id="kill"><span>🚨</span><div><div class="kill-text">KILL SWITCH ACTIVE</div></div></div>
    
    <div class="portfolio">
        <div class="port-header">
            <span class="port-title">Portfolio</span>
            <span class="port-time" id="refresh-time">--:--</span>
        </div>
        <div class="port-grid">
            <div class="metric">
                <span class="metric-label">Equity</span>
                <span class="metric-value" id="equity">$1,000.00</span>
            </div>
            <div class="metric">
                <span class="metric-label">Daily P&L</span>
                <span class="metric-value" id="pnl">+$0.00</span>
            </div>
            <div class="metric">
                <span class="metric-label">Positions</span>
                <span class="metric-value" id="positions">0</span>
            </div>
            <div class="metric">
                <span class="metric-label">Max DD</span>
                <span class="metric-value" id="drawdown">0.0%</span>
            </div>
        </div>
        <div class="risk-bar"><div class="risk-fill" id="risk-fill" style="width:0%"></div></div>
        <div class="risk-label"><span>Risk Usage</span><span id="risk-pct">0%</span></div>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('positions', this)">Positions</div>
        <div class="tab" onclick="switchTab('signals', this)">Signals</div>
        <div class="tab" onclick="switchTab('history', this)">History</div>
        <div class="tab" onclick="switchTab('tv', this)">Chart</div>
    </div>
    
    <div class="tab-content active" id="tab-positions">
        <div class="section-header">
            <span class="section-title">Open Positions</span>
            <span class="badge" id="pos-count">0</span>
        </div>
        <div id="positions-list">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
    
    <div class="tab-content" id="tab-signals">
        <div class="section-header">
            <span class="section-title">Active Signals</span>
            <span class="badge" id="sig-count">0</span>
        </div>
        <div id="signals-list">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
    
    <div class="tab-content" id="tab-history">
        <div class="section-header">
            <span class="section-title">Trade History</span>
            <span class="badge" id="hist-count">0</span>
        </div>
        <div id="history-list">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
    
    <div class="tab-content" id="tab-tv">
        <div class="section-header"><span class="section-title">TradingView</span></div>
        <div class="tv-container">
            <iframe id="tv-chart" src="https://s.tradingview.com/widgetembed/?frameElementId=tv-chart&symbol=BINANCE:BTCUSDT.P&interval=15&timezone=Asia/Kolkata&theme=dark&style=1&locale=en&toolbar_bg=%230f1a1e&backgroundColor=%230f1a1e&gridColor=%231a2a30&textColor=%23878c8f&cursorColor=%2350d2c1&enable_publishing=false&hide_top_toolbar=false&withdateranges=true"></iframe>
        </div>
    </div>
    
    <div class="footer">
        <div class="footer-row">
            <div style="display:flex;align-items:center;"><span class="pulse" id="pulse"></span><span class="footer-text" id="scanner-status">Connecting...</span></div>
            <button class="refresh-btn" onclick="fetchData()">↻ Refresh</button>
        </div>
        <div class="footer-row">
            <span class="footer-text">FX RICH v3.0 · SMC Engine</span>
            <span class="footer-text" id="api-url-display"></span>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // ═══════════════════════════════════════════════
        // CONFIG — Auto-detects API from URL or uses fallback
        // ═══════════════════════════════════════════════
        const API_BASE = (() => {
            const hostname = window.location.hostname;
            // If dashboard is served via tunnel, try to find matching API tunnel
            // For now, use the known working API tunnel
            if (hostname.includes('trycloudflare') || hostname.includes('ngrok')) {
                // We're on a public tunnel — use the API tunnel
                return 'https://increases-type-extent-three.trycloudflare.com';
            }
            // Local dev
            return 'http://localhost:8989';
        })();
        
        // Show which API we're using
        document.getElementById('api-url-display').textContent = API_BASE.replace('https://','').replace('http://','');
        
        let lastData = null;
        let refreshTimer = null;
        
        // ═══════════════════════════════════════════════
        // API FETCH
        // ═══════════════════════════════════════════════
        async function fetchData() {
            showToast('Loading...', false);
            
            try {
                const ctrl = new AbortController();
                const timeout = setTimeout(() => ctrl.abort(), 8000);
                
                const resp = await fetch(API_BASE + '/api/summary', {
                    cache: 'no-store',
                    signal: ctrl.signal
                });
                clearTimeout(timeout);
                
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                
                const data = await resp.json();
                lastData = data;
                render(data);
                updateConn(true);
                showToast('✓ Updated', false, 800);
                
            } catch(e) {
                updateConn(false);
                console.log('API error:', e.message);
                // Show fallback with last data if available
                if (lastData) {
                    render(lastData);
                    showToast('⚠ Using cached data', true, 1500);
                } else {
                    showEmpty();
                    showToast('⚠ API offline', true, 2000);
                }
            }
        }
        
        // ═══════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════
        function render(data) {
            // Portfolio
            const equity = data.portfolio?.equity || 1000;
            document.getElementById('equity').textContent = fmt$(equity);
            
            const pnl = data.portfolio?.daily_pnl || 0;
            document.getElementById('pnl').textContent = fmtSigned(pnl);
            document.getElementById('pnl').className = 'metric-value ' + (pnl >= 0 ? 'positive' : 'negative');
            
            document.getElementById('positions').textContent = data.portfolio?.position_count || 0;
            document.getElementById('drawdown').textContent = (data.portfolio?.drawdown_pct || 0).toFixed(1) + '%';
            
            const riskPct = Math.min(data.portfolio?.risk_usage_pct || 0, 100);
            document.getElementById('risk-fill').style.width = riskPct + '%';
            document.getElementById('risk-pct').textContent = riskPct.toFixed(1) + '%';
            
            // Mode
            const mode = (data.mode || 'paper').toUpperCase();
            document.getElementById('mode').textContent = mode;
            if (mode === 'LIVE') {
                document.getElementById('mode').style.background = 'rgba(240,185,11,0.15)';
                document.getElementById('mode').style.color = '#f0b90b';
            }
            
            // Kill switch
            const kill = data.system?.kill_switch_active || false;
            document.getElementById('kill').className = 'kill-banner ' + (kill ? 'active' : '');
            
            // Positions
            const posList = document.getElementById('positions-list');
            const positions = data.positions || [];
            document.getElementById('pos-count').textContent = positions.length;
            
            if (!positions.length) {
                posList.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">No open positions</div><div class="empty-sub">Waiting for SMC signals...</div></div>';
            } else {
                posList.innerHTML = positions.map(p => {
                    const pnl = p.unrealized_pnl || 0;
                    const progress = p.progress_pct || 0;
                    const side = (p.side || 'LONG').toUpperCase();
                    return `
                    <div class="card">
                        <div class="card-header">
                            <span class="symbol"><span class="symbol-emoji">${emoji(p.symbol)}</span>${p.symbol}</span>
                            <span class="metric-value ${pnl>=0?'positive':'negative'}">${fmtSigned(pnl)}</span>
                        </div>
                        <div class="card-details">
                            <div class="detail"><span class="detail-label">Entry</span><span class="detail-value">${fmt$(p.entry_price)}</span></div>
                            <div class="detail"><span class="detail-label">Mark</span><span class="detail-value">${fmt$(p.mark_price||p.current_price)}</span></div>
                            <div class="detail"><span class="detail-label">Size</span><span class="detail-value">${p.quantity||p.size||0}</span></div>
                        </div>
                        <div class="progress"><div class="progress-fill ${progress>=50?'progress-green':'progress-red'}" style="width:${Math.min(progress,100)}%"></div></div>
                        <div class="card-footer"><span>${side} · SL: ${fmt$(p.sl_price)} · TP: ${fmt$(p.tp_price)}</span><span>${fmtTime(p.timestamp)}</span></div>
                    </div>`;
                }).join('');
            }
            
            // Signals
            const sigList = document.getElementById('signals-list');
            const signals = (data.signals || []).filter(s => s.status === 'ACTIVE').slice(0, 10);
            document.getElementById('sig-count').textContent = signals.length;
            
            if (!signals.length) {
                sigList.innerHTML = '<div class="empty"><div class="empty-icon">📡</div><div class="empty-text">No active signals</div><div class="empty-sub">Scanner checks every 5 minutes</div></div>';
            } else {
                sigList.innerHTML = signals.map(s => {
                    const dots = Array(5).fill(0).map((_,i) => `<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${i<(s.confirmations||0)?'var(--accent)':'var(--border)'};margin-right:2px;"></span>`).join('');
                    return `
                    <div class="card">
                        <div class="card-header">
                            <span class="symbol"><span class="symbol-emoji">${emoji(s.symbol)}</span>${s.symbol}</span>
                            <span class="side-badge ${s.signal==='BUY'?'side-long':'side-short'}">${s.signal}</span>
                        </div>
                        <div class="card-details">
                            <div class="detail"><span class="detail-label">Entry</span><span class="detail-value">${fmt$(s.entry_price)}</span></div>
                            <div class="detail"><span class="detail-label">SL</span><span class="detail-value" style="color:var(--loss)">${fmt$(s.sl_price)}</span></div>
                            <div class="detail"><span class="detail-label">TP</span><span class="detail-value" style="color:var(--profit)">${fmt$(s.tp_price)}</span></div>
                        </div>
                        <div style="margin:8px 0;">${dots}</div>
                        <div class="card-footer"><span>${s.metadata?.bos_choch || 'SMC Setup'}</span><span>RR: ${s.metadata?.rr || 'N/A'}</span></div>
                    </div>`;
                }).join('');
            }
            
            // History
            const histList = document.getElementById('history-list');
            const trades = (data.trades || []).slice(0, 10);
            document.getElementById('hist-count').textContent = trades.length;
            
            if (!trades.length) {
                histList.innerHTML = '<div class="empty"><div class="empty-icon">📜</div><div class="empty-text">No trades yet</div><div class="empty-sub">First trade will appear here</div></div>';
            } else {
                histList.innerHTML = trades.map(t => {
                    const pnl = t.realized_pnl || 0;
                    const win = pnl > 0;
                    return `
                    <div class="card">
                        <div class="card-header">
                            <span class="symbol"><span class="symbol-emoji">${emoji(t.symbol)}</span>${t.symbol}</span>
                            <span class="${win?'positive':'negative'}">${win?'✅':'❌'} ${fmtSigned(pnl)}</span>
                        </div>
                        <div class="card-details">
                            <div class="detail"><span class="detail-label">Entry</span><span class="detail-value">${fmt$(t.entry_price)}</span></div>
                            <div class="detail"><span class="detail-label">Close</span><span class="detail-value">${fmt$(t.close_price||t.exit_price||'—')}</span></div>
                            <div class="detail"><span class="detail-label">State</span><span class="detail-value">${t.state||'CLOSED'}</span></div>
                        </div>
                        <div class="card-footer"><span>${fmtTime(t.closed_at||t.timestamp)}</span><span>${t.side} ${t.quantity||''}</span></div>
                    </div>`;
                }).join('');
            }
            
            // Scanner status
            const paused = data.system?.scanner_paused || false;
            document.getElementById('scanner-status').textContent = paused ? 'Scanner Paused' : 'Scanner Active';
            document.getElementById('pulse').className = 'pulse ' + (paused ? '' : 'active');
            
            // Refresh time
            document.getElementById('refresh-time').textContent = new Date().toLocaleTimeString('en-IN',{
                hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
            });
        }
        
        function showEmpty() {
            ['positions-list','signals-list','history-list'].forEach(id => {
                const el = document.getElementById(id);
                if (el && !el.querySelector('.card')) {
                    const label = id.replace('-list','').replace('positions','positions').replace('signals','signals').replace('history','trades');
                    el.innerHTML = `<div class="empty"><div class="empty-icon">⚠</div><div class="empty-text">Connection failed</div><div class="empty-sub">Tap Refresh to retry</div></div>`;
                }
            });
        }
        
        // ═══════════════════════════════════════════════
        // UI HELPERS
        // ═══════════════════════════════════════════════
        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }
        
        function updateConn(online) {
            document.getElementById('conn-dot').className = 'conn-dot ' + (online ? 'online' : '');
            document.getElementById('conn-text').textContent = online ? 'Online' : 'Offline';
        }
        
        function showToast(msg, isError = false, duration = 1500) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (isError ? 'error' : '') + ' show';
            setTimeout(() => { t.classList.remove('show'); }, duration);
        }
        
        function fmt$(v) {
            if (v === null || v === undefined || v === '—') return '—';
            const n = parseFloat(v);
            if (isNaN(n)) return '—';
            return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
        }
        function fmtSigned(v) {
            const n = parseFloat(v)||0;
            return (n>=0?'+':'') + fmt$(n).replace('$','');
        }
        function fmtTime(iso) {
            if(!iso) return '--';
            const d = new Date(iso);
            return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
        }
        function emoji(s) {
            const m = {BTC:'₿',ETH:'⟠',SOL:'◎',XRP:'✕',DOGE:'Ð',ADA:'₳',DOT:'•',LINK:'⬡',BNB:'◆',AVAX:'▲'};
