<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pablo's Trade Hub</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
.container { text-align: center; padding: 2rem; max-width: 500px; }
.logo { font-size: 2rem; font-weight: 900; color: #f0b90b; margin-bottom: 0.3rem; }
.subtitle { color: #555; font-size: 0.8rem; margin-bottom: 2rem; }
.status { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; }
.status.connecting { background: rgba(240,185,11,0.1); border: 1px solid rgba(240,185,11,0.3); color: #f0b90b; }
.status.online { background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.3); color: #00e676; }
.status.offline { background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3); color: #ff3232; }
.btn { display: block; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 700; margin: 0.5rem 0; }
.btn-main { background: linear-gradient(135deg, #f0b90b, #d4a00a); color: #0a0a14; }
.btn-fxrich { background: linear-gradient(135deg, #ff6b35, #ff4500); color: #fff; }
.btn-fxrich:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(255,107,53,0.4); }
.btn-main:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(240,185,11,0.4); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(240,185,11,0.3); border-top-color: #f0b90b; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.meta { color: #444; font-size: 0.7rem; margin-top: 2rem; }
.meta a { color: #f0b90b; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
<div class="logo">TRADE HUB</div>
<div class="subtitle">Live Dashboard</div>
<div id="status" class="status connecting">
<span class="spinner"></span>
<span id="status-text">Connecting...</span>
</div>
<a id="go-main" class="btn btn-main" href="#" style="display:none">Open Main Dashboard</a>
<a id="go-fxrich" class="btn btn-fxrich" href="#" style="display:none">Open FX RICH Dashboard</a>
<div id="retry" style="display:none; margin-top:1rem; color:#f0b90b; font-size:0.85rem;">
Reconnecting in <span id="cd">10</span>s...
</div>
<div class="meta">
Permanent link &middot; Auto-redirects on load
</div>
</div>
<script>
(async function connect() {
const st = document.getElementById('status');
const goMain = document.getElementById('go-main');
const goFxrich = document.getElementById('go-fxrich');

let tunnelUrl = null;
try {
const r = await fetch('https://cdn.jsdelivr.net/gh/hermes18974-jpg/trade-fx@main/tunnel_url.json?_=' + Date.now());
if (r.ok) { const d = await r.json(); if (d.url) tunnelUrl = d.url; }
} catch(e) {}

if (!tunnelUrl) {
st.className = 'status offline';
document.getElementById('status-text').textContent = 'Cannot reach config server. Retrying...';
let s = 10;
document.getElementById('retry').style.display = 'block';
const iv = setInterval(() => {
s--;
document.getElementById('cd').textContent = s;
if (s <= 0) { clearInterval(iv); location.reload(); }
}, 1000);
return;
}

st.className = 'status online';
st.innerHTML = '&#10003; Redirecting...';
goMain.href = tunnelUrl + '/dashboard/index.html';
goFxrich.href = tunnelUrl + '/dashboard/fx_rich.html';
goMain.style.display = 'block';
goFxrich.style.display = 'block';

// Use replace() so Back button returns here, not to a dead tunnel page
setTimeout(() => { window.location.replace(tunnelUrl + '/dashboard/index.html'); }, 1000);
})();
</script>
</body>
</html>
