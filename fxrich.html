<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX RICH - Smart Money Concepts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
.container { text-align: center; padding: 2rem; max-width: 500px; }
.logo { font-size: 2rem; font-weight: 900; color: #ff6b35; text-shadow: 0 0 20px rgba(255,107,53,0.5); margin-bottom: 0.3rem; letter-spacing: 0.1em; }
.subtitle { color: #666; font-size: 0.8rem; margin-bottom: 2rem; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,107,53,0.3); border-top-color: #ff6b35; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.status { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.85rem; }
.status.connecting { background: rgba(255,170,0,0.1); border: 1px solid rgba(255,170,0,0.3); color: #ffaa00; }
.status.online { background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.3); color: #ff6b35; }
.status.offline { background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3); color: #ff3232; }
.btn { display: block; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 1.1rem; transition: all 0.3s; margin: 0.5rem 0; }
.btn-fxrich { background: linear-gradient(135deg, #ff6b35, #ff4500); color: #fff; }
.btn-fxrich:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(255,107,53,0.4); }
.retry { margin-top: 1rem; color: #ffaa00; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
.meta { color: #444; font-size: 0.7rem; margin-top: 2rem; }
.meta a { color: #ff6b35; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
<div class="logo">FX RICH</div>
<div class="subtitle">Smart Money Concepts</div>
<div id="status" class="status connecting"><span class="spinner"></span> Loading live dashboard...</div>
<a id="go" class="btn btn-fxrich" href="#" style="display:none">Open FX RICH Dashboard</a>
<div id="retry" class="retry" style="display:none">Reconnecting in <span id="cd">5</span>s...</div>
<div class="meta">
Permanent link &middot; Auto-loads live data<br>
<a href="/trade-fx/main.html">Main Dashboard</a>
</div>
</div>
<script>
// STEP 1: Get tunnel URL from CDN
// STEP 2: Load the REAL dashboard HTML from the tunnel and replace the page
(async function() {
const statusEl = document.getElementById('status');
const goEl = document.getElementById('go');
const retryEl = document.getElementById('retry');
let tunnelUrl = null;

try {
const r = await fetch('https://cdn.jsdelivr.net/gh/hermes18974-jpg/trade-fx@main/tunnel_url.json?_=' + Date.now());
if (r.ok) { const d = await r.json(); if (d.url) tunnelUrl = d.url; }
} catch(e) {}

if (!tunnelUrl) {
statusEl.className = 'status offline';
statusEl.innerHTML = 'Cannot reach config server. <span class="retry" onclick="location.reload()">Retry</span>';
retryEl.style.display = 'none';
return;
}

// Verify tunnel is alive (img beacon - no CORS, no preflight)
const testUrl = tunnelUrl + '/dashboard/fx_rich_scan.json?_beacon=1&t=' + Date.now();
try {
await new Promise((resolve) => {
const img = new Image();
const timeout = setTimeout(resolve, 4000);
img.onload = () => { clearTimeout(timeout); resolve(); };
img.onerror = () => { clearTimeout(timeout); resolve(); };
img.src = testUrl;
});
} catch(e) {}

// Navigate directly to the real dashboard on the tunnel
// Use replace() so Back returns here (not stuck on 1033)
const targetUrl = tunnelUrl + '/dashboard/fx_rich.html';
goEl.href = targetUrl;
goEl.style.display = 'block';
statusEl.className = 'status online';
statusEl.innerHTML = '✓ Connected! Redirecting...';
window.location.replace(targetUrl);
})();
</script>
</body>
</html>
