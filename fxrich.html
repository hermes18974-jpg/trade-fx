<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX RICH - Smart Money Concepts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a14; color: #e0e0e0; font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
.container { text-align: center; padding: 2rem; max-width: 500px; }
.logo { font-size: 2rem; font-weight: 900; color: #ff6b35; text-shadow: 0 0 20px rgba(255,107,53,0.5); margin-bottom: 0.3rem; letter-spacing: 0.1em; }
.subtitle { color: #666; font-size: 0.8rem; margin-bottom: 2rem; }
.status { padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.85rem; }
.status.connecting { background: rgba(255,170,0,0.1); border: 1px solid rgba(255,170,0,0.3); color: #ffaa00; }
.status.online { background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.3); color: #ff6b35; }
.status.offline { background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3); color: #ff3232; }
.btn { display: block; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 1.1rem; transition: all 0.3s; margin: 0.5rem 0; }
.btn-fxrich { background: linear-gradient(135deg, #ff6b35, #ff4500); color: #fff; }
.btn-fxrich:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(255,107,53,0.4); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,170,0,0.3); border-top-color: #ffaa00; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.meta { color: #444; font-size: 0.7rem; margin-top: 2rem; }
.meta a { color: #ff6b35; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
<div class="logo">FX RICH</div>
<div class="subtitle">Smart Money Concepts</div>
<div id="status" class="status connecting">
<span class="spinner"></span>
<span id="status-text">Connecting to live server...</span>
</div>
<a id="go" class="btn btn-fxrich" href="#" style="display:none">Open FX RICH Dashboard</a>
<div style="display:flex; gap:0.5rem; justify-content:center; margin-top:1rem; flex-wrap:wrap;">
<a href="/trade-fx/main.html" style="color:#666; font-size:0.75rem;">Main Dashboard</a>
</div>
<div id="retry" style="display:none; margin-top:1rem; color:#ffaa00; font-size:0.85rem;">
Reconnecting in <span id="cd">10</span>s...
</div>
<div class="meta">
Permanent link &middot; Auto-redirects on load<br>
Powered by <a href="https://github.com/hermes18974-jpg/trade-fx">Pablo's Trade Hub</a>
</div>
</div>
<script>
// Robust redirect: fetch tunnel URL from CDN, then test tunnel with img beacon
// (not fetch/XHR = no CORS issues). Only redirect when tunnel responds.
(async function connect() {
const st = document.getElementById('status');
const txt = document.getElementById('status-text');
const go = document.getElementById('go');
const FXRICH_PATH = '/dashboard/fx_rich.html';
let tunnelUrl = null;

// Step 1: Get current tunnel URL from GitHub CDN (no-cache buster)
try {
const r = await fetch('https://cdn.jsdelivr.net/gh/hermes18974-jpg/trade-fx@main/tunnel_url.json?_=' + Date.now());
if (r.ok) { const d = await r.json(); if (d.url) tunnelUrl = d.url; }
} catch(e) {}

if (!tunnelUrl) {
st.className = 'status offline';
txt.textContent = 'Cannot reach config server. Retrying...';
let s = 10;
document.getElementById('retry').style.display = 'block';
const iv = setInterval(() => {
s--;
document.getElementById('cd').textContent = s;
if (s <= 0) { clearInterval(iv); location.reload(); }
}, 1000);
return;
}

// Step 2: Verify tunnel is alive using img beacon (no CORS, no preflight)
// If the tunnel is up, loading a 1px image from it will succeed
const targetUrl = tunnelUrl + FXRICH_PATH;
const testUrl = tunnelUrl + '/dashboard/completed_trades.json?_beacon=1';
let tunnelAlive = false;

try {
await new Promise((resolve, reject) => {
const img = new Image();
const timeout = setTimeout(() => { img.src = ''; resolve(); }, 5000);
img.onload = () => { clearTimeout(timeout); tunnelAlive = true; resolve(); };
img.onerror = () => { clearTimeout(timeout); resolve(); }; // Not necessarily dead, might just not be an image
img.src = testUrl;
});
} catch(e) {}

// Step 3: Regardless of beacon test, attempt redirect.
// If tunnel is down, Cloudflare will show 1033 and user can hit back to retry.
// The beacon test was just to show status indicator.
st.className = 'status online';
st.innerHTML = '&#10003; Redirecting' + (tunnelAlive ? '' : '...');
go.href = targetUrl;
go.style.display = 'block';

// Use replace() so hitting Back returns to this redirect page (not a dead tunnel)
setTimeout(() => { window.location.replace(targetUrl); }, 1000);
})();
</script>
</body>
</html>
